    const CHOSEONG = [
      'ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ',
      'ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'
    ];

    function getChoseong(str) {
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 44032;
        if (code >= 0 && code <= 11171) {
          result += CHOSEONG[Math.floor(code / 588)];
        } else {
          result += str[i];
        }
      }
      return result;
    }

    function matchKorean(target, query) {
      const q = query.trim().toLowerCase().replace(/\s+/g, '');
      if (!q) return true;
      const t = target.toLowerCase().replace(/\s+/g, '');
      const tCho = getChoseong(t);
      return t.includes(q) || tCho.includes(q);
    }

    // 등급별 뱃지 색상 반환
    function getTierBadge(tier) {
      if (tier === '프리즘') return 'bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-500/40';
      if (tier === '골드') return 'bg-amber-500/20 text-amber-300 border-amber-500/40';
      return 'bg-slate-500/20 text-slate-300 border-slate-500/40';
    }

    // =========================================================================
    // [구역 7] 시너지 추천 점수 계산 엔진
    // =========================================================================
    function evaluateCandidates() {
      if (state.candidateAugments.length === 0) return [];

      const champTags = state.selectedChamp ? state.selectedChamp.tags : [];
      const ownedTags = state.ownedAugments.flatMap(a => a.tags);

      return state.candidateAugments.map(aug => {
        let score = aug.baseScore * 0.6; // 기본 티어 가중치
        const reasons = [];

        // 1) 내 챔피언 태그 매칭
        const matchedChampTags = aug.tags.filter(tag => champTags.includes(tag));
        if (matchedChampTags.length > 0) {
          score += matchedChampTags.length * 14;
          reasons.push(`${state.selectedChamp.name} 핵심 궁합 (${matchedChampTags.join(', ')})`);
        }

        // 2) 보유 증강과의 시너지 매칭
        const matchedOwnedTags = [...new Set(aug.tags.filter(tag => ownedTags.includes(tag)))];
        if (matchedOwnedTags.length > 0) {
          score += matchedOwnedTags.length * 10;
          reasons.push(`보유 증강 시너지 (${matchedOwnedTags.join(', ')})`);
        }

        // 3) 기본 티어 사유
        if (reasons.length === 0) {
          reasons.push(`${aug.tier} 등급 기본 밸류 우수`);
        }

        return {
          ...aug,
          finalScore: Math.round(score),
          reasons
        };
      }).sort((a, b) => b.finalScore - a.finalScore);
    }

    // =========================================================================
    // [구역 8] UI 렌더링 함수
    // =========================================================================
    const elSearchChamp = document.getElementById('search-champ');
    const elListChamp = document.getElementById('list-champ');
    const elSlotChamp = document.getElementById('selected-champ-slot');

    const elSearchOwned = document.getElementById('search-owned');
    const elListOwned = document.getElementById('list-owned');
    const elSlotOwned = document.getElementById('selected-owned-slot');

    const elSearchCandidate = document.getElementById('search-candidate');
    const elListCandidate = document.getElementById('list-candidate');
    const elSlotCandidates = document.getElementById('selected-candidates-slot');
    const elCandidateCount = document.getElementById('candidate-count');

    const elResultList = document.getElementById('result-list');

    function renderChampions() {
      const query = elSearchChamp.value;
      const filtered = CHAMPIONS.filter(c => matchKorean(c.name, query));

      // 선택 슬롯
      if (state.selectedChamp) {
        elSlotChamp.innerHTML = `
          <button onclick="clearChamp()" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-indigo-500/20 border border-indigo-500/50 text-indigo-200 text-xs font-semibold hover:bg-indigo-500/30 transition">
            <span>${state.selectedChamp.name}</span>
            <span class="text-[10px] text-indigo-300/80">(${state.selectedChamp.tags.slice(0, 3).join('·')})</span>
            <span class="text-indigo-400 ml-1">✕</span>
          </button>
        `;
      } else {
        elSlotChamp.innerHTML = `<span class="text-xs text-slate-500">선택된 챔피언이 없습니다.</span>`;
      }

      // 목록
      elListChamp.innerHTML = filtered.map(c => {
        const isSelected = state.selectedChamp?.id === c.id;
        return `
          <button onclick="selectChamp('${c.id}')" class="text-left px-3 py-2 rounded-lg border text-xs transition ${
            isSelected
              ? 'bg-indigo-600/30 border-indigo-400 text-white font-bold'
              : 'bg-navy-950/70 border-slate-800 text-slate-300 hover:border-slate-600 hover:bg-slate-800/70'
          }">
            <div class="truncate">${c.name}</div>
            <div class="text-[10px] text-slate-400 truncate">${c.role}</div>
          </button>
        `;
      }).join('');
    }

    function renderOwned() {
      const query = elSearchOwned.value;
      const filtered = AUGMENTS.filter(a => matchKorean(a.name, query));

      // 선택 슬롯
      if (state.ownedAugments.length > 0) {
        elSlotOwned.innerHTML = state.ownedAugments.map(a => `
          <button onclick="toggleOwned('${a.id}')" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-200 text-xs font-medium hover:bg-emerald-500/30 transition">
            <span>${a.name}</span>
            <span class="text-emerald-400">✕</span>
          </button>
        `).join('');
      } else {
        elSlotOwned.innerHTML = `<span class="text-xs text-slate-500">보유한 증강이 없습니다. (선택 사항)</span>`;
      }

      // 목록
      elListOwned.innerHTML = filtered.map(a => {
        const isSelected = state.ownedAugments.some(o => o.id === a.id);
        return `
          <button onclick="toggleOwned('${a.id}')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg border text-xs transition ${
            isSelected
              ? 'bg-emerald-600/20 border-emerald-500/60 text-white font-semibold'
              : 'bg-navy-950/70 border-slate-800 text-slate-300 hover:border-slate-600'
          }">
            <span class="truncate">${a.name}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded border ${getTierBadge(a.tier)}">${a.tier}</span>
          </button>
        `;
      }).join('');
    }

    function renderCandidates() {
      const query = elSearchCandidate.value;
      const filtered = AUGMENTS.filter(a => matchKorean(a.name, query));

      elCandidateCount.textContent = `${state.candidateAugments.length} / 3 선택됨`;

      // 후보 3개 슬롯
      elSlotCandidates.innerHTML = [0, 1, 2].map(idx => {
        const aug = state.candidateAugments[idx];
        if (!aug) {
          return `
            <div class="h-16 rounded-xl border border-dashed border-slate-700 bg-navy-950/40 flex items-center justify-center text-xs text-slate-500">
              후보 ${idx + 1} 비어 있음
            </div>
          `;
        }
        return `
          <button onclick="toggleCandidate('${aug.id}')" class="h-16 px-3.5 py-2 rounded-xl border border-amber-500/50 bg-amber-500/10 text-left flex flex-col justify-center hover:bg-amber-500/20 transition relative group">
            <div class="flex items-center justify-between w-full">
              <span class="text-xs font-bold text-amber-200 truncate">${aug.name}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded border ${getTierBadge(aug.tier)}">${aug.tier}</span>
            </div>
            <span class="text-[10px] text-slate-400 truncate mt-1">${aug.tags.join(' · ')}</span>
          </button>
        `;
      }).join('');

      // 후보 검색 목록
      elListCandidate.innerHTML = filtered.map(a => {
        const isSelected = state.candidateAugments.some(c => c.id === a.id);
        return `
          <button onclick="toggleCandidate('${a.id}')" class="flex items-center justify-between px-3 py-2 rounded-lg border text-xs transition ${
            isSelected
              ? 'bg-amber-500/20 border-amber-400 text-white font-semibold'
              : 'bg-navy-950/70 border-slate-800 text-slate-300 hover:border-slate-600'
          }">
            <div class="truncate pr-2 text-left">
              <div class="truncate">${a.name}</div>
              <div class="text-[10px] text-slate-500 truncate">${a.tags.join(', ')}</div>
            </div>
            <span class="shrink-0 text-[10px] px-1.5 py-0.5 rounded border ${getTierBadge(a.tier)}">${a.tier}</span>
          </button>
        `;
      }).join('');
    }

    function renderResults() {
      const ranked = evaluateCandidates();

      if (ranked.length === 0) {
        elResultList.innerHTML = `
          <p class="text-sm text-slate-400 text-center py-6">
            후보 증강을 1개 이상 선택하면 추천 순위와 이유가 표시됩니다.
          </p>
        `;
        return;
      }

      const rankStyles = [
        { badge: 'bg-amber-400 text-navy-950', border: 'border-amber-400/60 bg-amber-500/10', label: '1순위 강력 추천' },
        { badge: 'bg-slate-300 text-navy-950', border: 'border-slate-600 bg-slate-800/40', label: '2순위 무난함' },
        { badge: 'bg-orange-400/80 text-navy-950', border: 'border-slate-700 bg-navy-950/60', label: '3순위 비추천' }
      ];

      elResultList.innerHTML = ranked.map((item, idx) => {
        const style = rankStyles[idx] || rankStyles[2];
        return `
          <div class="p-4 rounded-xl border ${style.border} flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition">
            <div class="space-y-1.5">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-black px-2 py-0.5 rounded-md ${style.badge}">${idx + 1}위</span>
                <span class="text-base font-bold text-white">${item.name}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded border ${getTierBadge(item.tier)}">${item.tier}</span>
                <span class="text-xs text-slate-400">(${style.label})</span>
              </div>
              <p class="text-xs text-slate-300">${item.desc}</p>
              <div class="flex flex-wrap gap-1.5 pt-0.5">
                ${item.reasons.map(r => `<span class="text-[11px] px-2 py-0.5 rounded-md bg-indigo-500/15 text-indigo-300 border border-indigo-500/20">✓ ${r}</span>`).join('')}
              </div>
            </div>
            <div class="sm:text-right shrink-0">
              <div class="text-[11px] text-slate-400">추천 점수</div>
              <div class="text-2xl font-black text-indigo-400">${item.finalScore}<span class="text-xs font-normal text-slate-500">점</span></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      renderChampions();
      renderOwned();
      renderCandidates();
      renderResults();
    }

    // =========================================================================
    // [구역 9] 사용자 액션 핸들러
    // =========================================================================
    window.selectChamp = function(id) {
      state.selectedChamp = CHAMPIONS.find(c => c.id === id) || null;
      renderAll();
    };

    window.clearChamp = function() {
      state.selectedChamp = null;
      renderAll();
    };

    window.toggleOwned = function(id) {
      const exists = state.ownedAugments.some(a => a.id === id);
      if (exists) {
        state.ownedAugments = state.ownedAugments.filter(a => a.id !== id);
      } else {
        const target = AUGMENTS.find(a => a.id === id);
        if (target) state.ownedAugments.push(target);
      }
      renderAll();
    };

    window.toggleCandidate = function(id) {
      const exists = state.candidateAugments.some(a => a.id === id);
      if (exists) {
        state.candidateAugments = state.candidateAugments.filter(a => a.id !== id);
      } else {
        if (state.candidateAugments.length >= 3) {
          alert('후보 증강은 최대 3개까지만 선택할 수 있습니다.');
          return;
        }
        const target = AUGMENTS.find(a => a.id === id);
        if (target) state.candidateAugments.push(target);
      }
      renderAll();
    };

    // 검색창 실시간 이벤트 및 초기화 버튼 연결
    elSearchChamp.addEventListener('input', renderChampions);
    elSearchOwned.addEventListener('input', renderOwned);
    elSearchCandidate.addEventListener('input', renderCandidates);

    document.getElementById('btn-reset').addEventListener('click', () => {
      state.selectedChamp = null;
      state.ownedAugments = [];
      state.candidateAugments = [];
      elSearchChamp.value = '';
      elSearchOwned.value = '';
      elSearchCandidate.value = '';
      renderAll();
    });

    // 초기 화면 렌더링
    renderAll();
  </script>
</body>
</html>
