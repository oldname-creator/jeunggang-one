<h1>증강원</h1>

<h2>1. 내 챔피언</h2>
<input id="myChamp" list="champ">

<datalist id="champ">
  <option>헤카림</option>
  <option>제이스</option>
  <option>징크스</option>
</datalist>

<h2>2. 먹은 증강</h2>
<input id="ownedAug" list="Augment">

<datalist id="Augment">
  <option>보석 건틀릿</option>
  <option>검을 뽑아라</option>
  <option>기본으로 돌아가기</option>
</datalist>

<h2>3. 먹을 증강 3개</h2>
<input id="pick1" list="Augment">
<input id="pick2" list="Augment">
<input id="pick3" list="Augment">
<br><br>

<button id="recommendBtn">증강 추천 받기</button>

<!-- 결과가 출력될 빈 자리 -->
<h2 id="resultBox"></h2>

<script>
  // 1. 화면에서 버튼 찾아오기
  const btn = document.getElementById("recommendBtn");

  // 2. 버튼을 클릭하면 실행할 명령 묶음
  btn.addEventListener("click", function() {
    // 각 칸에 유저가 적은 글자 읽어오기
    const champ = document.getElementById("myChamp").value;
    const p1 = document.getElementById("pick1").value;
    const p2 = document.getElementById("pick2").value;
    const p3 = document.getElementById("pick3").value;

    // 결과 자리에 문장 띄우기
    const resultBox = document.getElementById("resultBox");
    resultBox.innerText = champ + " 유저님! 후보 [" + p1 + ", " + p2 + ", " + p3 + "] 중 1순위 계산 준비 완료!";
  });
</script>
